<span class="inline-block px-3 py-1 text-xs font-medium
  {% if status == 'pending' %}bg-yellow-100 text-yellow-800
  {% elif status == 'accepted' %}bg-blue-100 text-blue-800
  {% elif status == 'completed' %}bg-green-100 text-green-800
  {% elif status == 'denied' %}bg-red-100 text-red-800
  {% else %}bg-gray-100 text-gray-700{% endif %}">
  {{ label }}
</span>
