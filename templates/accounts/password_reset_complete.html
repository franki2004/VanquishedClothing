{% extends "store/base.html" %}
{% block title %}Password Updated | Vanquished Clothing{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">

    <div class="w-full max-w-md space-y-6 bg-white p-8 shadow-md text-center">

        <p class="text-xs uppercase tracking-[0.3em] text-gray-500">
            Vanquished Clothing
        </p>

        <!-- CHECK ICON -->
        <div class="mx-auto flex h-20 w-20 items-center justify-center border border-green-700 text-green-700">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                class="h-9 w-9"
                aria-hidden="true"
            >
                <path d="m5 12.5 4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>

        <div>
            <h1 class="text-3xl font-semibold uppercase tracking-tight text-gray-900">
                Password updated
            </h1>
            <p class="mt-3 text-sm leading-6 text-gray-500">
                Your password has been changed successfully. You can now
                sign in with your new password.
            </p>
        </div>

        <div class="flex flex-col gap-3 pt-2">
            <a href="{% url 'login' %}"
               class="flex min-h-12 items-center justify-center border border-black bg-black px-6 py-3 text-xs font-semibold uppercase tracking-[0.15em] text-white transition-colors hover:bg-white hover:text-black">
                Sign in
            </a>

            <a href="{% url 'home' %}"
               class="flex min-h-12 items-center justify-center border border-gray-300 bg-white px-6 py-3 text-xs font-semibold uppercase tracking-[0.15em] text-black transition-colors hover:border-black">
                Continue shopping
            </a>
        </div>

    </div>
</section>
{% endblock %}
